<!-- The tab icon: one dandelion seed, the motif the whole site is built on.
     Drawn rather than scaled from a photo, so it stays crisp at 16px. The
     filaments are deliberately few and thick — at tab size, the fine ones on
     the real seeds turn to mush. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#f1dfd6" />
  <g fill="none" stroke="#8a6a5d" stroke-width="3.2" stroke-linecap="round">
    <path d="M32,30 L14,20" />
    <path d="M32,30 L18,10" />
    <path d="M32,30 L26,6" />
    <path d="M32,30 L38,6" />
    <path d="M32,30 L46,10" />
    <path d="M32,30 L50,20" />
    <path d="M32,52 L32,30" />
  </g>
  <ellipse cx="32" cy="55" rx="3.4" ry="5" fill="#bb8b79" />
</svg>
